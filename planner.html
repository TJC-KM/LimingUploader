<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<link rel="icon" type="image/png" href="logo_10th.png">
<title>教會活動 — 黎明教會</title>
<meta property="og:site_name" content="黎明寶庫">
<meta property="og:title" content="黎明教會活動">
<meta property="og:description" content="教會和各團契接下來的活動；契長、各股負責人也在這裡排活動。">
<meta property="og:image" content="https://tjc-km.github.io/LimingUploader/logo_10th.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 教會活動與年度活動規劃：資料由 Worker（/plan）讀寫 Google 試算表「黎明教會行事曆」。版面：手機一欄。首頁是給所有人看的活動清單；負責人從右上角「排活動」（#plan，有空著的週末）選自己負責的 → 各團契自己的維護頁（全年週末，每月一段、日期由左到右＋自己的活動）；編輯在底部面板，填日期時馬上顯示前後幾天的狀況 */
:root {
  color-scheme: only light;
  --f-display: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", "STKaiti", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;

  --bg: #f4f6f3;
  --card: #ffffff;
  --fg: #22272b;
  --muted: #646d73;
  --line: rgba(30, 45, 40, 0.12);
  --shadow: 0 1px 2px rgba(20, 35, 30, 0.05), 0 8px 24px rgba(20, 35, 30, 0.06);
  --overlay: rgba(15, 20, 18, 0.45);
  --accent: #2c5e4f;
  --on-accent: #ffffff;
  --accent-soft: #e3eee9;

  --quiet: #eef1ee;
  --ok: #b9d6c8;     --ok-fg: #24563f;
  --warn: #f4d58a;   --warn-fg: #7a5200;   --warn-bg: #fdf4dc;
  --busy: #e8806d;   --busy-fg: #8f2614;   --busy-bg: #fbe6e1;
  --danger: #b4342f;
  --holiday: #c0281b;

  --g-youth: #0b7f82;  --g-youth-bg: #dff1f1;
  --g-core: #a85a17;   --g-core-bg: #f6e9dc;
  --g-caleb: #6a4c9c;  --g-caleb-bg: #ece6f6;
  --g-family: #2a68aa; --g-family-bg: #e1ebf7;
  --g-choir: #b8365f;  --g-choir-bg: #f7e1e8;
  --g-mission: #8a6a0c; --g-mission-bg: #f5edd5;
  --g-edu: #4d5f6e;    --g-edu-bg: #e6ebef;
  --g-church: #3c7339; --g-church-bg: #e3efe1;

  --sea-spring: #b84a6f; --sea-summer: #1c6e9f; --sea-autumn: #b3561b; --sea-winter: #3a6584;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

#app {
  max-width: 760px; margin: 0 auto;
  padding-block: 18px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}
.g-youth  { --g: var(--g-youth);  --gbg: var(--g-youth-bg); }
.g-core   { --g: var(--g-core);   --gbg: var(--g-core-bg); }
.g-caleb  { --g: var(--g-caleb);  --gbg: var(--g-caleb-bg); }
.g-family { --g: var(--g-family); --gbg: var(--g-family-bg); }
.g-choir  { --g: var(--g-choir);  --gbg: var(--g-choir-bg); }
.g-mission { --g: var(--g-mission); --gbg: var(--g-mission-bg); }
.g-edu    { --g: var(--g-edu);    --gbg: var(--g-edu-bg); }
.g-church { --g: var(--g-church); --gbg: var(--g-church-bg); }

/* 頁首 */
.top { display: grid; gap: 10px; }
.back { justify-self: start; display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 4px; border: 0; background: none; color: var(--accent); font-size: 16px; text-decoration: none; }
.kicker { font-size: 14px; color: var(--muted); letter-spacing: 0.08em; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
h1 { margin: 0; font-family: var(--f-display); font-size: clamp(28px, 7vw, 38px); line-height: 1.2; font-weight: 700; text-wrap: balance; }
h1 .badge { vertical-align: 0.15em; margin-right: 8px; }
.lead { margin: 0; color: var(--muted); font-size: 16px; max-width: 34em; }
.years { display: inline-flex; gap: 4px; padding: 4px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); justify-self: start; }
.years button { min-height: 42px; padding: 0 18px; border: 0; border-radius: 99px; background: none; font-size: 16px; font-variant-numeric: tabular-nums; }
.years button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }

.badge {
  display: inline-grid; place-items: center;
  width: 34px; height: 34px; flex: none;
  border-radius: 10px;
  background: var(--g); color: var(--card);
  font-family: var(--f-display); font-size: 19px; font-weight: 700; line-height: 1;
}
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel-h { margin: 0; padding: 16px 18px 4px; font-family: var(--f-display); font-size: 21px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.panel-h small { font-family: var(--f-body); font-size: 14px; font-weight: 400; color: var(--muted); }
.panel-body { padding: 8px 18px 18px; }

/* 首頁摘要 */
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 8px 18px 6px; }
.stat { border-radius: 14px; padding: 10px 12px; background: var(--quiet); min-width: 0; }
.stat b { display: block; font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; color: var(--muted); }
.stat.busy { background: var(--busy-bg); } .stat.busy b { color: var(--busy-fg); }
.stat.warn { background: var(--warn-bg); } .stat.warn b { color: var(--warn-fg); }
.big-link { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 10px 18px 18px; min-height: 52px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 700; text-decoration: none; }

.who { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 8px 18px 18px; }
@media (min-width: 620px) { .who { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.who a {
  display: grid; gap: 6px; align-content: start;
  padding: 14px; min-height: 108px;
  border-radius: 16px; border: 1px solid var(--line);
  background: var(--gbg);
  color: var(--fg); text-decoration: none;
}
.who a:hover { border-color: var(--g); }
.who .name { font-size: 18px; font-weight: 700; line-height: 1.3; }
.who .nb { white-space: nowrap; }
.who .count { font-size: 14px; color: var(--muted); }
.who .flag { font-size: 14px; font-weight: 500; color: var(--warn-fg); }
.who .flag.busy { color: var(--busy-fg); }

/* 全年週末格 */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); padding: 0 18px 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 16px; height: 16px; border-radius: 5px; display: inline-block; }
/* 每個月一段，日期由左到右照順序排；連在一起的日子靠在一起成一組。格子寬度讓手機一行剛好放得下 4 個週末 */
.heat { --cell: clamp(32px, calc((100vw - 104px) / 8), 44px); padding: 4px 18px 12px; }
.mblock { padding: 10px 0 12px; }
.mblock + .mblock { border-top: 1px solid var(--line); }
.mon { margin: 0 0 6px; font-size: 16px; font-weight: 700; }
.strip { display: flex; flex-wrap: wrap; gap: 8px; }
.run { display: flex; flex-wrap: wrap; gap: 2px; }
.sq {
  width: var(--cell); height: 50px;
  border-radius: 11px;
  border: 0; padding: 0;
  display: grid; place-content: center; justify-items: center;
  font-size: 16px; line-height: 1.15; font-variant-numeric: tabular-nums;
  background: var(--quiet); color: var(--muted);
  position: relative;
}
.sq small { font-size: 12px; font-weight: 400; }
.sq.ok { background: var(--ok); color: var(--ok-fg); font-weight: 700; }
.sq.warn { background: var(--warn); color: var(--warn-fg); font-weight: 700; }
.sq.busy { background: var(--busy); color: var(--card); font-weight: 700; }
.sq.hol:not(.busy) { color: var(--holiday); font-weight: 700; }
.sq.mine { box-shadow: inset 0 0 0 3px var(--g); }
.sq.past { opacity: 0.55; }
.sq[aria-pressed="true"] { outline: 3px solid var(--fg); outline-offset: 2px; }
.week-detail { margin: 12px 0 2px; padding: 12px 14px; border-radius: 14px; background: var(--quiet); font-size: 15px; scroll-margin-bottom: 90px; }
.week-detail h3 { margin: 0 0 6px; font-size: 16px; }
.hol-name { margin-left: 8px; color: var(--holiday); }
.hol-line { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
.hol-line b, .hol-key { color: var(--holiday); font-weight: 700; margin-right: 6px; }

.spring { color: var(--sea-spring); } .summer { color: var(--sea-summer); } .autumn { color: var(--sea-autumn); } .winter { color: var(--sea-winter); }

/* 活動清單 */
.list { list-style: none; margin: 0; padding: 4px 12px 12px; display: grid; }
.ev { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px 6px; }
.ev + .ev { border-top: 1px solid var(--line); }
.ev-date { text-align: center; line-height: 1.15; font-variant-numeric: tabular-nums; padding-top: 2px; }
.ev-date b { display: block; font-size: 20px; font-weight: 700; }
.ev-date span { font-size: 13px; color: var(--muted); }
.ev-body { min-width: 0; }
.ev-body h3 { margin: 0; font-size: 18px; line-height: 1.35; overflow-wrap: anywhere; }
.meta { margin: 4px 0 0; font-size: 15px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.status { font-size: 13px; padding: 1px 9px; border-radius: 99px; font-weight: 500; }
.status.tentative { border: 1.5px dashed var(--muted); color: var(--muted); }
.status.confirmed { background: var(--accent-soft); color: var(--accent); border: 1.5px solid transparent; }
.note { margin: 6px 0 0; font-size: 15px; overflow-wrap: anywhere; }
.alert { margin: 8px 0 0; padding: 8px 10px; border-radius: 10px; font-size: 15px; line-height: 1.5; }
.alert.warn { background: var(--warn-bg); color: var(--warn-fg); }
.alert.busy { background: var(--busy-bg); color: var(--busy-fg); }
.alert.ok { background: var(--accent-soft); color: var(--accent); }
.alert b { font-weight: 700; }
.alert p { margin: 0; }
.alert p + p { margin-top: 4px; }
.ev.pub { grid-template-columns: 64px minmax(0, 1fr); }
.ev.pub.past { opacity: 0.6; }
.ev-date.hol b, .hol-tag { color: var(--holiday); }
.host { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px 2px 3px; border-radius: 99px; background: var(--gbg); color: var(--fg); font-size: 14px; }
.host i { font-style: normal; width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; background: var(--g); color: var(--card); font-family: var(--f-display); font-size: 12px; font-weight: 700; }
.soon { display: inline-block; vertical-align: 0.15em; margin-left: 4px; padding: 1px 8px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-family: var(--f-body); font-size: 13px; font-weight: 700; }
.more-btn { display: block; width: calc(100% - 36px); margin: 12px 18px 18px; min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--accent); font-size: 16px; font-weight: 500; }
.edit-btn { min-height: 42px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--accent); font-size: 15px; font-weight: 500; }
.empty { margin: 0; padding: 6px 18px 18px; color: var(--muted); }
.readonly-note { margin: 0; padding: 0 18px 16px; font-size: 14px; color: var(--muted); }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  max-width: 100%;
  padding: 3px 10px 3px 4px; border-radius: 99px;
  background: var(--gbg); color: var(--fg);
  font-size: 15px; line-height: 1.35;
  border: 1.5px solid transparent;
}
.chip.tentative { border-style: dashed; border-color: var(--g); }
.chip i { font-style: normal; width: 22px; height: 22px; border-radius: 7px; display: inline-grid; place-items: center; background: var(--g); color: var(--card); font-family: var(--f-display); font-size: 13px; font-weight: 700; flex: none; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* 首頁依月份分段 */
.month { padding: 4px 0 6px; }
.month + .month { border-top: 1px solid var(--line); }
.month-h { margin: 0; padding: 12px 18px 4px; font-family: var(--f-display); font-size: 20px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.month-h small { font-family: var(--f-body); font-size: 14px; color: var(--muted); font-weight: 400; }
.lv { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 99px; line-height: 1.5; vertical-align: 0.1em; }
.lv.warn { background: var(--warn); color: var(--warn-fg); }
.lv.busy { background: var(--busy); color: var(--card); }

/* 排活動頁：空著的週末、怎麼判斷 */
.free { list-style: none; margin: 0; padding: 4px 18px 16px; display: grid; gap: 6px; font-size: 16px; }
.free li { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); }
.free .long { color: var(--holiday); font-size: 14px; }
.free .nb { white-space: nowrap; }
.rules { font-size: 15px; color: var(--muted); padding: 4px 18px 18px; margin: 0; display: grid; gap: 6px; }
.rules li { margin-left: 1.1em; }

/* 新增按鈕、首頁的「排活動」按鈕（都浮在右上角）、編輯面板 */
.fab {
  position: fixed;
  top: calc(14px + env(safe-area-inset-top, 0px));
  right: calc(16px + env(safe-area-inset-right, 0px));
  z-index: 20;
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 48px; padding: 0 18px;
  border: 0; border-radius: 99px;
  background: var(--g, var(--accent)); color: var(--card);
  font-size: 17px; font-weight: 700;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
}
.fab svg { width: 20px; height: 20px; }
.fab.plan-fab { background: var(--card); color: var(--accent); border: 2px solid var(--accent); text-decoration: none; }
.sheet-wrap { position: fixed; inset: 0; z-index: 30; background: var(--overlay); display: grid; align-items: end; justify-items: center; }
@media (min-width: 700px) { .sheet-wrap { align-items: center; } }
.sheet {
  width: 100%; max-width: 560px; max-height: 94vh; overflow-y: auto;
  background: var(--card);
  border-radius: 22px 22px 0 0;
  padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
}
@media (min-width: 700px) { .sheet { border-radius: 22px; } }
.sheet h2 { margin: 0 0 14px; font-family: var(--f-display); font-size: 24px; display: flex; align-items: center; gap: 10px; }
.form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .label { font-size: 15px; font-weight: 500; }
.hint { font-size: 13px; color: var(--muted); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
input[type="text"], input[type="date"], input[type="time"], textarea {
  width: 100%; min-width: 0; max-width: 100%; min-height: 48px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg); font-size: 17px;
}
textarea { min-height: 80px; resize: vertical; }
input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices label { position: relative; }
.choices input { position: absolute; opacity: 0; pointer-events: none; }
.choices span { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); font-size: 16px; }
.choices input:checked + span { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 700; }
.choices input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.check { border-radius: 14px; padding: 12px 14px; font-size: 15px; display: grid; gap: 8px; }
.check.ok { background: var(--accent-soft); color: var(--accent); }
.check.warn { background: var(--warn-bg); color: var(--warn-fg); }
.check.busy { background: var(--busy-bg); color: var(--busy-fg); }
.check h4 { margin: 0; font-size: 16px; }
.check p { margin: 0; }
.check .chips { color: var(--fg); }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.suggest button { min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid currentColor; background: var(--card); color: inherit; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
.err { margin: 0; color: var(--danger); font-size: 15px; min-height: 1.4em; }
.sheet-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { min-height: 50px; padding: 0 20px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-size: 17px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; flex: 1; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: none; }
.btn[disabled] { opacity: 0.6; cursor: wait; }
.loading { margin: 0; padding: 24px 18px; color: var(--muted); font-size: 17px; }
.btn.danger.armed { background: var(--danger); color: var(--card); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 40; max-width: calc(100vw - 32px); padding: 10px 18px; border-radius: 99px; background: var(--fg); color: var(--card); font-size: 15px; }
.foot { color: var(--muted); font-size: 14px; display: grid; gap: 6px; }
.link-btn { border: 0; background: none; padding: 4px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; justify-self: start; font-size: 14px; }
</style>
</head>
<body>

<div id="app" aria-live="polite"></div>

<button class="fab" id="fab" type="button" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  <span>新增活動</span>
</button>
<a class="fab plan-fab" id="plan-fab" href="#plan" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
  <span>排活動</span>
</a>

<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">新增活動</h2>
    <form class="form" id="form" novalidate>
      <div class="field">
        <label for="f-title">活動名稱</label>
        <input type="text" id="f-title" autocomplete="off" maxlength="60" placeholder="例如：年終感恩聚會">
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-date">日期</label>
          <input type="date" id="f-date">
        </div>
        <div class="field">
          <label for="f-enddate">到哪一天</label>
          <input type="date" id="f-enddate">
          <span class="hint">一天的活動不用填</span>
        </div>
      </div>
      <div class="check" id="f-check" hidden></div>
      <div class="field">
        <span class="label">誰會參加</span>
        <div class="choices" id="f-audience"></div>
      </div>
      <div class="field">
        <span class="label">日期定了嗎</span>
        <div class="choices">
          <label><input type="radio" name="status" value="tentative" id="f-status-tentative"><span>暫定，還可以調</span></label>
          <label><input type="radio" name="status" value="confirmed" id="f-status-confirmed"><span>確定了</span></label>
        </div>
      </div>
      <div class="field">
        <label for="f-time">時間</label>
        <input type="time" id="f-time">
        <span class="hint">還不知道可以先不填</span>
      </div>
      <div class="field">
        <label for="f-note">備註</label>
        <textarea id="f-note" maxlength="500" placeholder="例如：中區還沒公布，先照往年的日期"></textarea>
      </div>
      <p class="err" id="f-err" role="alert"></p>
      <div class="sheet-actions">
        <button type="button" class="btn danger" id="f-delete" hidden>刪除</button>
        <button type="button" class="btn" id="f-cancel">取消</button>
        <button type="submit" class="btn primary" id="f-save">儲存</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const API = 'https://liminguploader.c3012312.workers.dev';
  const WEEK = ['週日', '週一', '週二', '週三', '週四', '週五', '安息日'];
  const WEEK_SHORT = ['日', '一', '二', '三', '四', '五', '六'];
  // title：頁面標題、卡片上的名稱（中區聯契的活動也填在那個團契）；沒有 title 就用 name
  const GROUPS = {
    youth:  { name: '社青團契',     title: '社青團契／聯契', short: '社青', mark: '社' },
    core:   { name: '中堅團契',     title: '中堅團契／聯契', short: '中堅', mark: '堅' },
    caleb:  { name: '迦勒團契',     title: '迦勒團契／聯契', short: '迦勒', mark: '迦' },
    family: { name: '全家信主團契', short: '全家', mark: '家' },
    choir:  { name: '成人詩班',     short: '詩班', mark: '詩' },
    mission: { name: '宣道股',      short: '宣道股', mark: '宣' },
    edu:    { name: '教育股',       short: '教育股', mark: '育' },
    church: { name: '其他活動',     short: '其他', mark: '其' },
  };
  const titleOf = g => GROUPS[g].title || GROUPS[g].name;
  const PEOPLE = ['youth', 'core', 'caleb', 'family', 'choir'];
  // 其他活動只有某個團契的人參加時，可以選的團契
  const DISTRICT = ['youth', 'core', 'caleb'];

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
  const seasonOf = m => (m >= 3 && m <= 5 ? 'spring' : m >= 6 && m <= 8 ? 'summer' : m >= 9 && m <= 11 ? 'autumn' : 'winter');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // 呼叫 Worker；有 body 用 POST。失敗時丟出可以給使用者看的訊息
  async function api(path, body) {
    let res;
    try {
      res = await fetch(API + path, body
        ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
        : { cache: 'no-store' });
    } catch (e) {
      throw new Error('連不上網路，請稍後再試一次');
    }
    let data = {};
    try { data = await res.json(); } catch (e) { /* 回應不是 JSON */ }
    if (!res.ok || data.error) {
      const err = new Error(data.error || `伺服器出了問題（${res.status}），請稍後再試一次`);
      err.status = res.status;
      throw err;
    }
    return data;
  }

  // quiet：已經有資料時在背景更新，失敗就留著原本的資料
  async function loadEvents(quiet) {
    try {
      const data = await api('/plan');
      events = data.events || [];
      loaded = true;
      loadError = '';
    } catch (e) {
      if (quiet && loaded) return;
      loadError = e.message;
    }
    render();
    if (!$('sheet-wrap').hidden) updateCheck();
  }

  const now = new Date();
  const todayStr = ymd(now);
  // 秋天以後主要在排明年
  const planYear = now.getMonth() >= 8 ? now.getFullYear() + 1 : now.getFullYear();
  const YEARS = [planYear - 1, planYear];
  let year = planYear;
  let events = [];
  let loaded = false;
  let loadError = '';
  let saving = false;
  let picked = null;   // 全年週末點到的那一天

  // 國定假日：行政院人事行政總處的「辦公日曆表」，用 GitHub 上整理成 JSON 的版本。讀不到就不顯示，其他功能照常
  const HOLIDAY_URL = 'https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar@master/data/';
  const holidays = new Map();   // 'YYYY-MM-DD' → { name, off }；off 是 false 的是補行上班
  async function loadHolidays(y) {
    try {
      const res = await fetch(`${HOLIDAY_URL}${y}.json`);
      if (!res.ok) return;
      const list = await res.json();
      for (const x of list) {
        if (!x.description) continue;
        const key = `${x.date.slice(0, 4)}-${x.date.slice(4, 6)}-${x.date.slice(6, 8)}`;
        holidays.set(key, { name: x.description, off: x.isHoliday === true });
      }
    } catch (e) {
      return;
    }
    if (loaded) render();
  }
  function isHoliday(key) {
    const h = holidays.get(key);
    return Boolean(h && h.off);
  }
  // 一段日子裡放假的日子，連著同名的合成一段，例如「2/6～2/8 春節」
  function holidayText(keys) {
    const parts = [];
    let last = null;
    for (const key of keys) {
      const h = holidays.get(key);
      if (!h) { last = null; continue; }
      const name = h.off ? h.name : `${h.name}（要上班）`;
      if (last && last.name === name && dayDiff(last.end, key) === 1) {
        last.end = key;
        continue;
      }
      last = { name, start: key, end: key };
      parts.push(last);
    }
    return parts.map(p => `${md(parseDate(p.start))}${p.end === p.start ? '' : '～' + md(parseDate(p.end))} ${p.name}`).join('、');
  }
  let showPast = false;   // 首頁要不要列出已經過去的活動

  // ── 判斷哪幾天太擠 ─────────────────────
  // 以「天」來看，週六、週日分開算

  const NEAR_DAYS = 7;   // 同一群人的兩個活動相隔幾天以內算太近

  function daysOf(ev) {
    const out = [];
    const end = parseDate(ev.endDate || ev.date);
    for (let d = parseDate(ev.date); d <= end; d = addDays(d, 1)) out.push(ymd(d));
    return out;
  }
  function dayDiff(a, b) {
    return Math.round((parseDate(b) - parseDate(a)) / 86400000);
  }
  function dayName(key) {
    const d = parseDate(key);
    return `${md(d)}（${WEEK_SHORT[d.getDay()]}）`;
  }
  function titles(list) {
    return list.map(e => e.title).join('、');
  }
  // 這個活動會用到哪些人：詩班、各股同工分散在各團契，家屬也可能在別的團契，全教會都可以參加的活動每個人都有份
  const STAFF = ['mission', 'edu'];
  const EVERYWHERE = ['choir'].concat(STAFF);
  function peopleOf(ev) {
    if (ev.audience === 'all' || ev.audience === 'family') return PEOPLE.slice();
    if (ev.audience === 'self') return EVERYWHERE.includes(ev.group) ? PEOPLE.slice() : [ev.group];
    return [ev.audience];
  }
  function groupNames(gs) {
    return gs.length === PEOPLE.length ? '各團契' : gs.map(g => GROUPS[g].short).join('、');
  }

  // 回傳這一年每天的活動、所有提醒，和還空著的週末（週六、週日都沒有活動）
  function analyze(list, y) {
    const yearStr = String(y);
    const sorted = list.slice().sort((a, b) => a.date.localeCompare(b.date));
    const days = new Map();
    const allDays = new Set();
    for (const ev of sorted) {
      for (const k of daysOf(ev)) {
        allDays.add(k);
        if (!k.startsWith(yearStr)) continue;
        if (!days.has(k)) days.set(k, { key: k, events: [], level: 'ok' });
        days.get(k).events.push(ev);
      }
    }
    const issues = [];

    // 撞期：同一天有同一群人，或同一天有 3 個以上活動
    for (const d of [...days.values()].sort((a, b) => a.key.localeCompare(b.key))) {
      const clash = PEOPLE.filter(g => d.events.filter(e => peopleOf(e).includes(g)).length >= 2);
      if (!clash.length && d.events.length < 3) continue;
      const ids = d.events.map(e => e.id);
      const sameSet = issues.find(is => is.lv === 'busy' && is.ids.join('|') === ids.join('|'));
      if (sameSet) { sameSet.days.push(d.key); continue; }
      issues.push({
        lv: 'busy', ids, groups: clash, days: [d.key], show: d.key,
        text: `${dayName(d.key)}同一天有 ${d.events.length} 個活動${clash.length ? `，${groupNames(clash)}的人會撞到` : ''}：${titles(d.events)}`,
      });
    }

    // 太近：同一群人的兩個活動相隔 NEAR_DAYS 天以內；同一天、同一群人的合併成一則
    const near = new Map();
    for (let i = 0; i < sorted.length; i++) {
      const a = sorted[i];
      const aEnd = a.endDate || a.date;
      for (let j = i + 1; j < sorted.length; j++) {
        const b = sorted[j];
        if (b.date <= aEnd) continue;
        if (dayDiff(aEnd, b.date) > NEAR_DAYS) continue;
        const groups = peopleOf(a).filter(g => peopleOf(b).includes(g));
        if (!groups.length) continue;
        const key = `${b.date}|${groups.join(',')}`;
        if (!near.has(key)) near.set(key, { show: b.date, groups, evs: [] });
        const n = near.get(key);
        for (const e of [a, b]) if (!n.evs.includes(e)) n.evs.push(e);
      }
    }
    const nearList = [...near.values()].filter(n => n.evs.some(e => daysOf(e).some(k => k.startsWith(yearStr))));
    for (const n of nearList) {
      const ids = n.evs.map(e => e.id);
      // 已經包含在別則裡（同樣的人、更多活動）就不再列一次
      const covered = nearList.some(m => m !== n && m.evs.length > n.evs.length
        && n.groups.every(g => m.groups.includes(g)) && ids.every(id => m.evs.some(e => e.id === id)));
      if (covered) continue;
      n.evs.sort((x, y) => x.date.localeCompare(y.date));
      issues.push({
        lv: 'warn', ids, groups: n.groups, days: [...new Set(n.evs.flatMap(daysOf))], show: n.show,
        text: `${groupNames(n.groups)}的人 ${NEAR_DAYS} 天內有 ${n.evs.length} 個活動：${n.evs.map(e => `${dayName(e.date)}${e.title}`).join('、')}`,
      });
    }

    for (const is of issues) {
      for (const k of is.days) {
        const d = days.get(k);
        if (d && (is.lv === 'busy' || d.level !== 'busy')) d.level = is.lv;
      }
    }

    const freeWeekends = [];
    let sat = new Date(y, 0, 1);
    while (sat.getDay() !== 6) sat = addDays(sat, 1);
    for (; sat.getFullYear() === y; sat = addDays(sat, 7)) {
      if (!allDays.has(ymd(sat)) && !allDays.has(ymd(addDays(sat, 1)))) freeWeekends.push(ymd(sat));
    }
    return { days, issues, freeWeekends };
  }

  // 這個活動有關的提醒
  function issuesOf(a, id) {
    return a.issues.filter(is => is.ids.includes(id));
  }
  function levelOf(issues) {
    return issues.some(is => is.lv === 'busy') ? 'busy' : issues.length ? 'warn' : 'ok';
  }

  // 同一個星期幾、前後 8 週內，搬過去不會撞到也不會太近的日子
  function suggestions(draft, others) {
    const out = [];
    const span = draft.endDate ? dayDiff(draft.date, draft.endDate) : 0;
    for (let dist = 1; dist <= 8 && out.length < 4; dist++) {
      for (const step of [-dist, dist]) {
        const start = ymd(addDays(parseDate(draft.date), step * 7));
        if (start < todayStr) continue;
        const moved = { ...draft, date: start, endDate: span ? ymd(addDays(parseDate(start), span)) : '' };
        const a = analyze(others.concat(moved), Number(start.slice(0, 4)));
        if (!issuesOf(a, moved.id).length) out.push(start);
      }
    }
    return out.slice(0, 4).sort();
  }

  // ── 共用的畫面片段 ─────────────────────

  function dateText(ev) {
    const s = parseDate(ev.date);
    if (!ev.endDate || ev.endDate === ev.date) return { big: md(s), small: WEEK[s.getDay()] };
    const e = parseDate(ev.endDate);
    return { big: md(s), small: `到 ${e.getMonth() === s.getMonth() ? e.getDate() + ' 日' : md(e)}` };
  }
  function audienceText(ev) {
    if (ev.audience === 'all') return '全教會都可以參加';
    if (ev.audience === 'family') return GROUPS[ev.group].short + '家屬';
    if (ev.audience === 'self') {
      if (ev.group === 'choir') return '詩班（各團契都有人）';
      if (STAFF.includes(ev.group)) return GROUPS[ev.group].name + '同工';
      return GROUPS[ev.group].short + '自己';
    }
    return GROUPS[ev.audience].short + '的人';
  }
  function chip(ev, withDate) {
    const g = ev.group;
    return `<span class="chip g-${g}${ev.status === 'tentative' ? ' tentative' : ''}" title="${esc(titleOf(g))}"><i>${GROUPS[g].mark}</i><span>${withDate ? dayName(ev.date) : ''}${esc(ev.title)}${ev.status === 'tentative' ? '（暫定）' : ''}</span></span>`;
  }
  function yearTabs() {
    return `<div class="years" role="group" aria-label="年份">${YEARS.map(y => `<button type="button" data-year="${y}" aria-pressed="${y === year}">${y} 年${y === planYear ? '（預排中）' : ''}</button>`).join('')}</div>`;
  }
  function dayLong(key) {
    const d = parseDate(key);
    return `${md(d)} ${WEEK[d.getDay()]}`;
  }
  // 兩個活動相隔幾天；日期有重疊就是 0
  function gapBetween(x, y) {
    const xEnd = x.endDate || x.date;
    const yEnd = y.endDate || y.date;
    if (y.date > xEnd) return dayDiff(xEnd, y.date);
    if (x.date > yEnd) return dayDiff(yEnd, x.date);
    return 0;
  }
  function nearbyOf(ev, list) {
    return list.filter(e => e.id !== ev.id && gapBetween(e, ev) <= NEAR_DAYS).sort((x, y) => x.date.localeCompare(y.date));
  }
  const LV_TEXT = { busy: '撞期', warn: '太近' };
  function issueLines(issues) {
    return issues.map(is => `<p><span class="lv ${is.lv}">${LV_TEXT[is.lv]}</span> ${esc(is.text)}</p>`).join('');
  }
  function issueAlert(issues) {
    if (!issues.length) return '';
    return `<div class="alert ${levelOf(issues)}">${issueLines(issues)}</div>`;
  }

  // ── 首頁：給所有人看的活動清單 ─────────

  // 給一般信徒看的「誰可以參加」；只有自己團契的人參加時不寫（旁邊已經有團契名稱）
  function publicAudience(ev) {
    const G = GROUPS[ev.group];
    if (ev.audience === 'all') return '全教會';
    if (ev.audience === 'family') return `${G.name}和家屬`;
    if (ev.audience === 'self') return STAFF.includes(ev.group) ? `${G.name}同工` : '';
    return GROUPS[ev.audience].name;
  }
  // 兩週內的活動標「今天」「明天」「3 天後」
  function soonText(ev) {
    const end = ev.endDate || ev.date;
    if (ev.date <= todayStr && end >= todayStr) return '今天';
    const n = dayDiff(todayStr, ev.date);
    if (n === 1) return '明天';
    if (n > 1 && n < 14) return `${n} 天後`;
    return '';
  }
  // 活動碰到的國定假日：一天的活動只寫名稱，好幾天的連日期一起寫
  function publicHoliday(ev) {
    if (!ev.endDate || ev.endDate === ev.date) {
      const h = holidays.get(ev.date);
      if (!h) return '';
      return h.off ? h.name : `${h.name}（要上班）`;
    }
    return holidayText(daysOf(ev));
  }
  function publicItem(ev, past) {
    const dt = dateText(ev);
    const soon = past ? '' : soonText(ev);
    const G = GROUPS[ev.group];
    const who = publicAudience(ev);
    const hol = publicHoliday(ev);
    return `<li class="ev pub${past ? ' past' : ''}">
      <div class="ev-date${isHoliday(ev.date) ? ' hol' : ''}"><b>${dt.big}</b><span>${dt.small}</span></div>
      <div class="ev-body">
        <h3>${esc(ev.title)}${soon ? ` <span class="soon">${soon}</span>` : ''}</h3>
        <p class="meta"><span class="host g-${ev.group}"><i>${G.mark}</i>${titleOf(ev.group)}</span>${who ? `<span>${who}</span>` : ''}${ev.time ? `<span>${esc(ev.time)} 開始</span>` : ''}${ev.status === 'tentative' ? '<span class="status tentative">日期暫定</span>' : ''}${hol ? `<span class="hol-tag">${esc(hol)}</span>` : ''}</p>
        ${ev.note ? `<p class="note">${esc(ev.note)}</p>` : ''}
      </div>
    </li>`;
  }
  // 依月份分段；不是今年的月份前面加年份
  function byMonth(list, past) {
    const months = new Map();
    for (const ev of list) {
      const key = ev.date.slice(0, 7);
      if (!months.has(key)) months.set(key, []);
      months.get(key).push(ev);
    }
    const thisYear = todayStr.slice(0, 4);
    return [...months.entries()].map(([key, evs]) => {
      const y = key.slice(0, 4);
      const m = Number(key.slice(5, 7));
      return `<div class="month">
        <h3 class="month-h ${seasonOf(m)}">${y === thisYear ? '' : y + ' 年 '}${m} 月</h3>
        <ul class="list">${evs.map(ev => publicItem(ev, past)).join('')}</ul>
      </div>`;
    }).join('');
  }

  // 首頁沒有活動時，說明是還沒有人填，不是壞掉
  function emptyHome(hasPast) {
    return `<p class="empty">${hasPast ? '目前沒有接下來的活動。' : '各團契的活動還在排，還沒有人填。'}<br>契長、各股負責人排好活動，就會出現在這裡。</p>`;
  }

  function renderHome() {
    const sorted = events.slice().sort((x, y) => x.date.localeCompare(y.date));
    const upcoming = sorted.filter(ev => (ev.endDate || ev.date) >= todayStr);
    const past = sorted.filter(ev => (ev.endDate || ev.date) < todayStr).reverse();
    $('app').innerHTML = `
      <header class="top">
        <div class="kicker">真耶穌教會黎明教會</div>
        <h1>教會活動</h1>
        <p class="lead">教會和各團契接下來的活動。寫「日期暫定」的，日期還可能會改。</p>
      </header>
      <section class="panel">
        <h2 class="panel-h">接下來的活動${upcoming.length ? `<small>${upcoming.length} 個</small>` : ''}</h2>
        ${upcoming.length ? byMonth(upcoming, false) : emptyHome(events.length > 0)}
      </section>
      ${past.length ? `<section class="panel">
        ${showPast ? `<h2 class="panel-h">已經過去的活動</h2>${byMonth(past, true)}` : ''}
        <button type="button" class="more-btn" id="toggle-past">${showPast ? '收起已經過去的活動' : '看已經過去的活動'}</button>
      </section>` : ''}`;
    const toggle = $('toggle-past');
    if (toggle) toggle.addEventListener('click', () => { showPast = !showPast; render(); });
  }

  // ── 排活動：給負責人的規劃首頁 ─────────

  // 空著的週末（週六的日期）；週五到週一有國定假日就標「連假」
  function freeText(sat) {
    const d = parseDate(sat);
    let long = false;
    for (let i = -1; i <= 2; i++) {
      if (isHoliday(ymd(addDays(d, i)))) long = true;
    }
    return `<span class="nb">${md(d)}${long ? '<span class="long">（連假）</span>' : ''}</span>`;
  }

  // 卡片上的名稱太長時，只在「／」後面換行
  function cardTitle(g) {
    const t = titleOf(g);
    const i = t.indexOf('／');
    if (i < 0) return t;
    return `<span class="nb">${t.slice(0, i + 1)}</span><span class="nb">${t.slice(i + 1)}</span>`;
  }

  function renderPlan() {
    const a = analyze(events, year);
    const yearEvents = events.filter(e => e.date.startsWith(String(year)));
    const busy = [...a.days.values()].filter(d => d.level === 'busy').length;
    const warn = a.issues.filter(is => is.lv === 'warn').length;
    const tentative = yearEvents.filter(e => e.status === 'tentative').length;
    // 空著的週末只列今天以後的，依月份一行
    const free = a.freeWeekends.filter(k => k >= todayStr);
    const freeLines = [];
    for (let m = 1; m <= 12; m++) {
      const ks = free.filter(k => k.slice(5, 7) === pad(m));
      if (ks.length) freeLines.push(`<li><b class="${seasonOf(m)}">${m} 月</b><span>${ks.map(freeText).join('、')}</span></li>`);
    }
    const cards = Object.keys(GROUPS).map(g => {
      const mine = yearEvents.filter(e => e.group === g);
      const flagged = a.issues.filter(is => mine.some(e => is.ids.includes(e.id)));
      const hasBusy = flagged.some(is => is.lv === 'busy');
      return `<a class="g-${g}" href="#g-${g}">
        <span class="badge">${GROUPS[g].mark}</span>
        <span class="name">${cardTitle(g)}</span>
        <span class="count">${year} 年排了 ${mine.length} 個活動</span>
        ${flagged.length ? `<span class="flag${hasBusy ? ' busy' : ''}">${flagged.length} 處要注意</span>` : ''}
      </a>`;
    }).join('');
    $('app').innerHTML = `
      <header class="top">
        <a class="back" href="#home">‹ 回教會活動</a>
        <div class="kicker">契長、各股負責人</div>
        <h1>年度活動規劃</h1>
        <p class="lead">先把想辦的活動填上去，系統會標出同一群人撞期或太近的日子，趁日期還是暫定的時候就能調開。</p>
        ${yearTabs()}
      </header>
      <section class="panel">
        <h2 class="panel-h">${year} 年<small>${yearEvents.length} 個活動，${tentative} 個還是暫定</small></h2>
        <div class="summary">
          <div class="stat busy"><b>${busy}</b><span>天撞期</span></div>
          <div class="stat warn"><b>${warn}</b><span>處太近</span></div>
          <div class="stat"><b>${free.length}</b><span>個週末還空著</span></div>
        </div>
        <p class="readonly-note" style="padding-top:8px">全部的活動照日期列在<a href="#home">「教會活動」首頁</a>。</p>
      </section>
      <section class="panel">
        <h2 class="panel-h">我負責…<small>點進去就能新增、修改</small></h2>
        <div class="who">${cards}</div>
      </section>
      <section class="panel">
        <h2 class="panel-h">空著的週末<small>週六、週日都還沒有活動，寫的是週六</small></h2>
        ${freeLines.length ? `<ul class="free">${freeLines.join('')}</ul>` : `<p class="empty">${year} 年接下來沒有空著的週末。</p>`}
      </section>
      <section class="panel">
        <h2 class="panel-h">怎麼判斷撞期、太近</h2>
        <ul class="rules">
          <li>一天一天看，週六、週日分開算。</li>
          <li><b>撞期</b>：同一群人同一天有 2 個活動，或同一天有 3 個以上的活動。</li>
          <li><b>太近</b>：同一群人 ${NEAR_DAYS} 天內有 2 個以上的活動，例如安息日接著週日，或連續兩個安息日。</li>
          <li>社青團契和中區社青聯契是同一群人，都填在「社青團契／聯契」；中堅、迦勒也一樣。</li>
          <li>成人詩班、宣道股、教育股的人分散在各團契，他們的活動算每個團契都有人參加。</li>
          <li>帶家屬的活動：家屬可能在別的團契，算每個團契都有人。</li>
          <li>全教會都可以參加的活動，算每個人都有份。</li>
          <li>國定假日只是標出來（紅字），照樣可以排活動，不算撞期、太近。</li>
        </ul>
      </section>
      <div class="foot">
        <span>資料存在 Google 試算表「黎明教會行事曆」。按「儲存」後，其他人重新整理就看得到。</span>
      </div>`;
  }

  // ── 各團契自己的維護頁 ─────────────────

  // 頁首的說明：哪些活動填在這一頁
  function leadOf(g) {
    if (g === 'church') return '沒有歸類的活動都填在這裡，例如全教會、中區、總會的活動。';
    const tip = '先填想辦的活動，日期還沒定就選「暫定」。別的團契排的活動也看得到，方便避開。';
    if (DISTRICT.includes(g)) return `${GROUPS[g].name}和中區${GROUPS[g].short}聯契的活動都填在這裡。${tip}`;
    return tip;
  }

  function renderGroup(g) {
    const G = GROUPS[g];
    const a = analyze(events, year);
    const cell = key => {
      const d = parseDate(key);
      const info = a.days.get(key);
      const lv = info ? info.level : '';
      const mineHere = info && info.events.some(e => e.group === g);
      const hol = holidays.get(key);
      return `<button type="button" class="sq ${lv}${mineHere ? ' mine' : ''}${isHoliday(key) ? ' hol' : ''}${key < todayStr ? ' past' : ''}" data-day="${key}" aria-pressed="${picked === key}" aria-label="${dayLong(key)}${hol ? '，' + esc(hol.name) : ''}，${info ? info.events.length + ' 個活動' : '沒有活動'}">${d.getDate()}<small>${WEEK_SHORT[d.getDay()]}</small></button>`;
    };

    const mine = events.filter(e => e.group === g && e.date.startsWith(String(year))).sort((x, y) => x.date.localeCompare(y.date));
    const items = mine.map(ev => {
      const dt = dateText(ev);
      const others = nearbyOf(ev, events);
      const issues = issuesOf(a, ev.id);
      return `<li class="ev">
        <div class="ev-date"><b>${dt.big}</b><span>${dt.small}</span></div>
        <div class="ev-body">
          <h3>${esc(ev.title)}</h3>
          <p class="meta"><span class="status ${ev.status}">${ev.status === 'tentative' ? '暫定' : '確定'}</span><span>${audienceText(ev)}</span>${ev.time ? `<span>${esc(ev.time)}</span>` : ''}</p>
          ${ev.note ? `<p class="note">${esc(ev.note)}</p>` : ''}
          ${others.length ? `<div class="alert ${levelOf(issues)}"><p>前後 ${NEAR_DAYS} 天還有：</p><div class="chips">${others.map(e => chip(e, true)).join('')}</div>${issueLines(issues)}</div>` : issueAlert(issues)}
        </div>
        <button class="edit-btn" type="button" data-edit="${esc(ev.id)}">修改</button>
      </li>`;
    }).join('');

    let detail = '';
    if (picked && picked.startsWith(String(year))) {
      const info = a.days.get(picked);
      const here = info ? info.events : [];
      const around = nearbyOf({ id: '', date: picked }, events).filter(e => !here.includes(e));
      const rel = a.issues.filter(is => is.days.includes(picked) && (g === 'church' || is.lv === 'busy' || is.groups.includes(g)));
      const hol = holidays.get(picked);
      detail = `<div class="week-detail" id="day-detail">
        <h3>${dayLong(picked)}${hol ? `<span class="hol-name">${esc(hol.name)}${hol.off ? '' : '（要上班）'}</span>` : ''}</h3>
        ${here.length ? `<div class="chips">${here.map(e => chip(e)).join('')}</div>` : '<p style="margin:0">這天還空著。</p>'}
        ${around.length ? `<p style="margin:8px 0 4px">前後 ${NEAR_DAYS} 天：</p><div class="chips">${around.map(e => chip(e, true)).join('')}</div>` : ''}
        ${issueAlert(rel)}
      </div>`;
    }

    const heat = [];
    for (let m = 0; m < 12; m++) {
      // 這個月的週六、週日，加上有活動或放假的平日，照日期排；連續的日子放成一組
      const prefix = `${year}-${pad(m + 1)}-`;
      const keys = [];
      const monthDays = [];
      for (let d = new Date(year, m, 1); d.getMonth() === m; d = addDays(d, 1)) {
        const key = ymd(d);
        monthDays.push(key);
        if (d.getDay() === 0 || d.getDay() === 6 || a.days.has(key) || isHoliday(key)) keys.push(key);
      }
      const hol = holidayText(monthDays);
      const runs = [];
      keys.forEach((key, i) => {
        if (i === 0 || dayDiff(keys[i - 1], key) !== 1) runs.push([]);
        runs[runs.length - 1].push(key);
      });
      const pickedHere = picked && picked.startsWith(prefix);
      heat.push(`<div class="mblock">
        <h3 class="mon ${seasonOf(m + 1)}">${m + 1} 月</h3>
        <div class="strip">${runs.map(r => `<div class="run">${r.map(cell).join('')}</div>`).join('')}</div>
        ${hol ? `<p class="hol-line"><b>放假</b>${esc(hol)}</p>` : ''}
        ${pickedHere ? detail : ''}
      </div>`);
    }

    $('app').innerHTML = `
      <header class="top g-${g}">
        <a class="back" href="#plan">‹ 回排活動</a>
        <div class="kicker">${year} 年的活動</div>
        <h1><span class="badge">${G.mark}</span>${titleOf(g)}</h1>
        <p class="lead">${leadOf(g)}</p>
        ${yearTabs()}
      </header>
      <section class="panel g-${g}">
        <h2 class="panel-h">全年的週末<small>每一格是一天，點了看那天有什麼</small></h2>
        <div class="legend">
          <span><i class="sw" style="background:var(--quiet)"></i>空的</span>
          <span><i class="sw" style="background:var(--ok)"></i>有活動</span>
          <span><i class="sw" style="background:var(--warn)"></i>太近</span>
          <span><i class="sw" style="background:var(--busy)"></i>撞期</span>
          <span><i class="sw" style="box-shadow:inset 0 0 0 3px var(--g)"></i>${g === 'church' ? '其他活動' : '我們有活動'}</span>
          ${holidays.size ? '<span><b class="hol-key">紅字</b>國定假日</span>' : ''}
        </div>
        <div class="heat">${heat.join('')}</div>
      </section>
      <section class="panel g-${g}">
        <h2 class="panel-h">${g === 'church' ? '其他活動' : '我們的活動'}<small>${mine.length} 個</small></h2>
        ${mine.length ? `<ul class="list">${items}</ul>` : `<p class="empty">${year} 年還沒有活動，按右上角「新增活動」開始填。</p>`}
      </section>`;

    // 明細出現在那個月下面；點的那一格留在畫面上原本的位置
    document.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => {
      const key = b.dataset.day;
      const before = b.getBoundingClientRect().top;
      picked = picked === key ? null : key;
      render();
      const again = document.querySelector(`.sq[data-day="${key}"]`);
      if (!again) return;
      window.scrollBy(0, again.getBoundingClientRect().top - before);
      again.focus({ preventScroll: true });
      const box = $('day-detail');
      if (box) box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }));
  }

  // ── 路由 ───────────────────────────────

  function route() {
    const h = location.hash.replace('#', '');
    if (h === 'plan') return { view: 'plan' };
    const m = h.match(/^g-(\w+)$/);
    if (m && GROUPS[m[1]]) return { view: 'group', group: m[1] };
    return { view: 'home' };
  }
  function render() {
    const r = route();
    if (!loaded) {
      $('app').innerHTML = `
        <header class="top">
          <div class="kicker">真耶穌教會黎明教會</div>
          <h1>教會活動</h1>
        </header>
        <section class="panel">${loadError
          ? `<p class="loading">${esc(loadError)}</p><button class="big-link" type="button" id="retry" style="border:0;width:calc(100% - 36px)">重新讀取</button>`
          : '<p class="loading">讀取中…</p>'}</section>`;
      if (loadError) $('retry').addEventListener('click', () => { loadError = ''; render(); loadEvents(); });
      $('fab').hidden = true;
      $('plan-fab').hidden = true;
      return;
    }
    if (r.view === 'group') renderGroup(r.group);
    else if (r.view === 'plan') renderPlan();
    else renderHome();
    const fab = $('fab');
    fab.hidden = r.view !== 'group';
    fab.className = 'fab' + (r.group ? ` g-${r.group}` : '');
    $('plan-fab').hidden = r.view !== 'home';
    document.querySelectorAll('[data-year]').forEach(b => b.addEventListener('click', () => {
      year = Number(b.dataset.year);
      picked = null;
      render();
    }));
  }
  window.addEventListener('hashchange', () => { picked = null; render(); window.scrollTo(0, 0); });
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-edit]');
    if (b) openEditor(b.dataset.edit);
  });

  // ── 編輯 ───────────────────────────────

  const form = $('form');
  let editId = null, editGroup = null, lastFocus = null;

  function audienceOptions(g) {
    if (g === 'church') {
      return [['all', '全教會都可以參加'], ...DISTRICT.map(k => [k, `${GROUPS[k].name}的人`])];
    }
    if (STAFF.includes(g)) {
      return [['all', '全教會都可以參加'], ['self', `${GROUPS[g].name}同工`]];
    }
    return [['self', `${GROUPS[g].short}自己`], ['family', `${GROUPS[g].short}家屬`], ['all', '全教會都可以參加']];
  }

  function openEditor(id) {
    const ev = id ? events.find(x => x.id === id) : null;
    editId = id || null;
    editGroup = ev ? ev.group : route().group;
    if (!editGroup) return;
    $('sheet-title').innerHTML = `<span class="badge g-${editGroup}">${GROUPS[editGroup].mark}</span>${ev ? '修改活動' : '新增活動'}`;
    $('f-audience').innerHTML = audienceOptions(editGroup).map(([v, label]) => `<label><input type="radio" name="audience" value="${v}" id="f-aud-${v}"><span>${label}</span></label>`).join('');
    const defaultDate = picked && picked.startsWith(String(year)) ? picked : (year === now.getFullYear() ? todayStr : `${year}-01-01`);
    $('f-title').value = ev ? ev.title : '';
    $('f-date').value = ev ? ev.date : defaultDate;
    $('f-enddate').value = ev && ev.endDate ? ev.endDate : '';
    $('f-time').value = ev && ev.time ? ev.time : '';
    $('f-note').value = ev && ev.note ? ev.note : '';
    $(`f-aud-${ev ? ev.audience : audienceOptions(editGroup)[0][0]}`).checked = true;
    $(`f-status-${ev ? ev.status : 'tentative'}`).checked = true;
    $('f-err').textContent = '';
    const del = $('f-delete');
    del.hidden = !ev;
    del.classList.remove('armed');
    del.textContent = '刪除';
    form.querySelectorAll('input[name="audience"]').forEach(r => r.addEventListener('change', updateCheck));
    lastFocus = document.activeElement;
    $('sheet-wrap').hidden = false;
    updateCheck();
    setTimeout(() => $('f-title').focus(), 30);
  }
  function closeEditor() {
    $('sheet-wrap').hidden = true;
    editId = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function draftFromForm() {
    return {
      id: editId || '__draft',
      group: editGroup,
      title: $('f-title').value.trim() || '這個活動',
      date: $('f-date').value,
      endDate: $('f-enddate').value && $('f-enddate').value > $('f-date').value ? $('f-enddate').value : '',
      audience: form.audience.value,
      status: form.status.value,
      time: $('f-time').value,
      note: $('f-note').value.trim(),
    };
  }

  // 填日期的當下，就把前後幾天的活動和附近不會撞到的日子列出來
  function updateCheck() {
    const box = $('f-check');
    const draft = draftFromForm();
    if (!draft.date) { box.hidden = true; return; }
    const others = events.filter(e => e.id !== editId);
    const a = analyze(others.concat(draft), Number(draft.date.slice(0, 4)));
    const issues = issuesOf(a, draft.id);
    const lv = levelOf(issues);
    const around = nearbyOf(draft, others);
    let html = `<h4>${dayLong(draft.date)}${lv === 'ok' ? '：沒有撞到' : lv === 'busy' ? '：撞期了' : '：太近了'}</h4>`;
    const hol = holidayText(daysOf(draft));
    if (hol) html += `<p>放假：${esc(hol)}</p>`;
    html += around.length ? `<p>前後 ${NEAR_DAYS} 天還有：</p><div class="chips">${around.map(e => chip(e, true)).join('')}</div>` : `<p>前後 ${NEAR_DAYS} 天都還沒有別的活動。</p>`;
    html += issues.map(is => `<p>${esc(is.text)}</p>`).join('');
    if (lv !== 'ok') {
      const sug = suggestions(draft, others);
      if (sug.length) html += `<div class="suggest"><span>附近不會撞到的日子：</span>${sug.map(k => `<button type="button" data-move="${k}">${dayName(k)}</button>`).join('')}</div>`;
    }
    box.className = `check ${lv}`;
    box.innerHTML = html;
    box.hidden = false;
    box.querySelectorAll('[data-move]').forEach(b => b.addEventListener('click', () => moveTo(b.dataset.move)));
  }
  // 改到建議的日子，多天的活動一起挪
  function moveTo(start) {
    const endVal = $('f-enddate').value;
    if (endVal) {
      const span = Math.max(0, dayDiff($('f-date').value, endVal));
      $('f-enddate').value = ymd(addDays(parseDate(start), span));
    }
    $('f-date').value = start;
    updateCheck();
    toast(`改到 ${dayLong(start)}，記得按儲存`);
  }
  ['f-date', 'f-enddate'].forEach(id => $(id).addEventListener('change', updateCheck));
  $('f-title').addEventListener('input', () => { if (!$('f-check').hidden) updateCheck(); });
  form.querySelectorAll('input[name="status"]').forEach(r => r.addEventListener('change', updateCheck));

  $('fab').addEventListener('click', () => openEditor(null));
  $('f-cancel').addEventListener('click', closeEditor);
  $('sheet-wrap').addEventListener('click', e => { if (e.target === $('sheet-wrap')) closeEditor(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet-wrap').hidden) closeEditor(); });
  // 存檔或刪除時把按鈕鎖住，避免按兩次
  function setSaving(on, label) {
    saving = on;
    ['f-save', 'f-delete', 'f-cancel'].forEach(id => { $(id).disabled = on; });
    $('f-save').textContent = on && label === 'save' ? '儲存中…' : '儲存';
    if (on && label === 'delete') $('f-delete').textContent = '刪除中…';
  }
  $('f-delete').addEventListener('click', async () => {
    const del = $('f-delete');
    if (saving) return;
    if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = '再按一次刪除'; return; }
    const id = editId;
    const ev = events.find(x => x.id === id);
    setSaving(true, 'delete');
    try {
      await api('/plan/delete', { id });
    } catch (e) {
      setSaving(false);
      del.classList.remove('armed');
      del.textContent = '刪除';
      $('f-err').textContent = e.message;
      return;
    }
    setSaving(false);
    events = events.filter(x => x.id !== id);
    closeEditor();
    render();
    toast(`已刪除「${ev ? ev.title : ''}」`);
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (saving) return;
    const err = $('f-err');
    const title = $('f-title').value.trim();
    const date = $('f-date').value;
    const endDate = $('f-enddate').value;
    if (!title) { err.textContent = '請填活動名稱'; $('f-title').focus(); return; }
    if (!date) { err.textContent = '請選日期'; $('f-date').focus(); return; }
    if (endDate && endDate < date) { err.textContent = '「到哪一天」不能比開始日期早'; $('f-enddate').focus(); return; }
    const data = draftFromForm();
    data.title = title;
    if (!data.time) delete data.time;
    if (!data.note) delete data.note;
    if (!data.endDate) delete data.endDate;
    const wasNew = !editId;
    if (wasNew) delete data.id;
    err.textContent = '';
    setSaving(true, 'save');
    let saved;
    try {
      saved = (await api('/plan', { event: data })).event;
    } catch (ex) {
      setSaving(false);
      err.textContent = ex.message;
      // 別人已經刪掉這個活動：重新讀一次，畫面才會跟試算表一樣
      if (ex.status === 404) loadEvents(true);
      return;
    }
    setSaving(false);
    const i = events.findIndex(x => x.id === saved.id);
    if (i >= 0) events[i] = saved;
    else events.push(saved);
    year = Number(date.slice(0, 4));
    picked = date;
    closeEditor();
    render();
    toast(wasNew ? `已新增「${title}」` : `已儲存「${title}」`);
  });

  let toastTimer = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  render();
  loadEvents();
  YEARS.forEach(loadHolidays);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && loaded && !saving) loadEvents(true);
  });
})();
</script>
</body>
</html>
