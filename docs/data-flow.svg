<text x="919" y="584" font-size="12.5" fill="#4a5164">解析安排表（程式解析不出來時）</text>
<text x="919" y="603" font-size="12.5" fill="#4a5164">worker.js 裡寫死 gemini-flash-latest</text>
<text x="919" y="622" font-size="12.5" fill="#4a5164">金鑰：Cloudflare 變數 GEMINI_API_KEY</text>
