<text x="414" y="895" font-size="14.5" font-weight="700" fill="#ffffff">網頁服務（只讀）</text>
<text x="414" y="923" font-size="12.5" fill="#4a5164">類別、資料夾、檔案清單 → ① ②</text>
<text x="414" y="942" font-size="12.5" fill="#4a5164">分享卡片頁 ③：查相簿名稱和封面，再轉到 ②</text>
<text x="414" y="961" font-size="12.5" fill="#4a5164">活動清單 → ④（已刪除、認不得的列不給）</text>
