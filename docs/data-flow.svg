<text x="414" y="190" font-size="14.5" font-weight="700" fill="#ffffff">寶庫：資料夾與檔案</text>
<text x="414" y="218" font-size="12.5" fill="#4a5164">新增資料夾、改名</text>
<text x="414" y="237" font-size="12.5" fill="#4a5164">刪除＝搬到刪除區（類別專屬的，沒設用全域）</text>
<text x="414" y="256" font-size="12.5" fill="#4a5164">上傳：給續傳網址，瀏覽器直接傳到 Drive</text>
<text x="414" y="275" font-size="12.5" fill="#4a5164">　100MB 以下也可以由 Worker 轉傳</text>
<text x="414" y="294" font-size="12.5" fill="#4a5164">錄音剪輯：讀雲端上的 MP3（/audio）</text>
<text x="414" y="313" font-size="12.5" fill="#4a5164">　取代原檔：檔案 ID 不變，原版本永久保留</text>
<text x="414" y="332" font-size="12.5" fill="#4a5164">不用密碼：有網址的人都能用這些功能</text>
