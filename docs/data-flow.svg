<text x="919" y="190" font-size="14.5" font-weight="700" fill="#ffffff">Google Drive 各類別資料夾</text>
<text x="919" y="218" font-size="12.5" font-weight="700" fill="#1a1d24">照片、影片、文件、錄音的正本</text>
<text x="919" y="237" font-size="12.5" fill="#4a5164">大多在共用雲端硬碟</text>
<text x="919" y="256" font-size="12.5" fill="#4a5164">　聚會錄音在 lmf@ 的雲端硬碟</text>
