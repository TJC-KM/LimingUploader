<text x="414" y="232" font-size="14.5" font-weight="700" fill="#ffffff">寶庫：資料夾與檔案</text>
<text x="414" y="260" font-size="12.5" fill="#4a5164">新增資料夾、改名</text>
<text x="414" y="279" font-size="12.5" fill="#4a5164">刪除＝搬到刪除區（類別專屬的，沒設用全域）</text>
<text x="414" y="298" font-size="12.5" fill="#4a5164">上傳：給續傳網址，瀏覽器直接傳到 Drive</text>
<text x="414" y="317" font-size="12.5" fill="#4a5164">　100MB 以下也可以由 Worker 轉傳</text>
<text x="414" y="336" font-size="12.5" fill="#4a5164">錄音剪輯：讀雲端上的 MP3（/audio）</text>
<text x="414" y="355" font-size="12.5" fill="#4a5164">　取代原檔：檔案 ID 不變，原版本永久保留</text>
<text x="414" y="374" font-size="12.5" fill="#4a5164">不用密碼：有網址的人都能用這些功能</text>
<rect x="400" y="411" width="390" height="111" fill="#ffffff" stroke="#7c9cc4" stroke-width="1.6" rx="7"/>
