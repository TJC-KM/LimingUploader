<text x="919" y="709" font-size="12.5" fill="#4a5164">在 Drive 安排表輸出資料夾</text>
<text x="919" y="728" font-size="12.5" fill="#4a5164">每月一個頁籤（民國年月，例 11512）</text>
<text x="919" y="747" font-size="12.5" fill="#4a5164">✎ 可以直接修正</text>
