<rect x="0" y="0" width="1640" height="1088" fill="#fbfbfd" stroke="#d7dae0" rx="8"/>
<text x="30" y="40" font-size="20" font-weight="700" fill="#1a1d24">黎明寶庫 LimingUploader：資料流程</text>
<text x="30" y="63" font-size="13" fill="#5c6270">四個畫面：① 寶庫首頁　② 分享圖庫　③ LINE 分享卡片　④ 教會活動　｜　藍＝照片與檔案　綠＝教會活動　金＝安排表與 AI　灰＝設定、只讀</text>
<text x="30" y="86" font-size="13" font-weight="700" fill="#4a5164">怎麼看：</text>
<text x="86" y="86" font-size="13" fill="#4a5164"><tspan font-weight="700">順著箭頭看</tspan>（左 → 右）：左邊的檔案、設定經過哪些處理，最後出現在哪個畫面</text>
<text x="86" y="106" font-size="13" fill="#4a5164"><tspan font-weight="700">逆著箭頭看</tspan>（右 → 左）：畫面上某一項是從哪裡來的，不對時要去哪裡改</text>
<text x="30" y="142" font-size="14" font-weight="700" fill="#1a1d24">來源</text>
<text x="385" y="142" font-size="14" font-weight="700" fill="#1a1d24">處理</text>
<text x="905" y="142" font-size="14" font-weight="700" fill="#1a1d24">資料</text>
<text x="1320" y="142" font-size="14" font-weight="700" fill="#1a1d24">畫面（讀資料都經由 Worker）</text>
<rect x="385" y="154" width="420" height="848" fill="#f1f3f7" stroke="#b9c2d4" rx="8"/>
<text x="399" y="176" font-size="14.5" font-weight="700" fill="#1a1d24">Cloudflare Worker：liminguploader</text>
<text x="399" y="196" font-size="12" fill="#5c6270">網頁呼叫（只接受 tjc-km.github.io）＋每月 20、25 號 08:00 排程</text>
<rect x="400" y="212" width="390" height="187" fill="#ffffff" stroke="#7c9cc4" stroke-width="1.6" rx="7"/>
