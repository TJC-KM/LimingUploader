<text x="414" y="431" font-size="14.5" font-weight="700" fill="#ffffff">LINE 發布</text>
<text x="414" y="459" font-size="12.5" fill="#4a5164">發送對象 ← LINE 排程試算表的 Users</text>
<text x="414" y="478" font-size="12.5" fill="#4a5164">寫一列到 Schedule：時間、對象、圖片或卡片</text>
<text x="414" y="497" font-size="12.5" fill="#4a5164">狀態「待發送」，由另一個系統依時間送出</text>
<rect x="400" y="534" width="390" height="187" fill="#ffffff" stroke="#c9a15c" stroke-width="1.6" rx="7"/>
<rect x="400" y="534" width="390" height="30" fill="#c9a15c" rx="7"/>
<rect x="400" y="556" width="390" height="8" fill="#c9a15c"/>
<text x="414" y="554" font-size="14.5" font-weight="700" fill="#ffffff">安排表轉檔</text>
<text x="414" y="582" font-size="12.5" fill="#4a5164">每月 20 號 08:00 轉「下個月」的安排表</text>
<text x="414" y="601" font-size="12.5" fill="#4a5164">　25 號只補做還沒轉好的，不覆蓋</text>
<text x="414" y="620" font-size="12.5" fill="#4a5164">也可以在 ① 寶庫首頁按「轉檔」</text>
<text x="414" y="639" font-size="12.5" fill="#4a5164">xlsx 匯成暫存試算表 → 程式解析</text>
<text x="414" y="658" font-size="12.5" fill="#4a5164">　解析不出來才請 Gemini（convert_prompt）</text>
<text x="414" y="677" font-size="12.5" fill="#4a5164">寫進「&lt;年&gt;年安排表」的月份頁籤</text>
<text x="414" y="696" font-size="12.5" fill="#4a5164">成功、失敗都寫一列到小幫手的 LINE 排程</text>
<rect x="400" y="733" width="390" height="130" fill="#ffffff" stroke="#7fa87f" stroke-width="1.6" rx="7"/>
<rect x="400" y="733" width="390" height="30" fill="#7fa87f" rx="7"/>
<rect x="400" y="755" width="390" height="8" fill="#7fa87f"/>
<text x="414" y="753" font-size="14.5" font-weight="700" fill="#ffffff">教會活動（/plan）</text>
<text x="414" y="781" font-size="12.5" fill="#4a5164">不用密碼，有網址的人都能新增、修改</text>
<text x="414" y="800" font-size="12.5" fill="#4a5164">新增、修改：檢查後寫 A～I 欄和 K 欄</text>
<text x="414" y="819" font-size="12.5" fill="#4a5164">刪除：只填 L 欄（刪除時間），不刪整列</text>
<text x="414" y="838" font-size="12.5" fill="#4a5164">名稱、備註前面加 ' 照字存，不會變成公式</text>
