<text x="385" y="100" font-size="14" font-weight="700" fill="#1a1d24">處理</text>
<text x="905" y="100" font-size="14" font-weight="700" fill="#1a1d24">資料</text>
<text x="1320" y="100" font-size="14" font-weight="700" fill="#1a1d24">畫面（讀資料都經由 Worker）</text>
<rect x="385" y="112" width="420" height="848" fill="#f1f3f7" stroke="#b9c2d4" rx="8"/>
<text x="399" y="134" font-size="14.5" font-weight="700" fill="#1a1d24">Cloudflare Worker：liminguploader</text>
<text x="399" y="154" font-size="12" fill="#5c6270">網頁呼叫（只接受 tjc-km.github.io）＋每月 20、25 號 08:00 排程</text>
