<text x="919" y="792" font-size="12.5" fill="#4a5164">活動分頁：一列一個活動，A～L 欄</text>
<text x="919" y="811" font-size="12.5" fill="#4a5164">✎ 可以直接改；刪除填 L 欄，不刪列</text>
<text x="919" y="830" font-size="12.5" fill="#4a5164">知道連結的人可以檢視</text>
